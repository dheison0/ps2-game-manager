name: PS2 Manager nightly build

on:
  push:
    branches: ["main"]

jobs:
  Release:
    name: Build PS2 Manager Nightly Binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build PS2Manager for Linux
        run: |
          CGO_ENABLED=0
          for arch in amd64 arm64 386 arm riscv64; do
            echo "Building Linux $arch..."
            GOOS=linux GOARCH=$arch go build -ldflags '-s -w' -trimpath -o "ps2manager-linux-$arch"
          done

      - name: Build PS2Manager for macOS (darwin)
        run: |
          CGO_ENABLED=0
          for arch in amd64 arm64; do
            echo "Building macOS $arch..."
            GOOS=darwin GOARCH=$arch go build -ldflags '-s -w' -trimpath -o "ps2manager-darwin-$arch"
          done

      - name: Create release message body
        id: release_body
        shell: bash
        run: |
          {
            echo "RELEASE_BODY<<EOF"
            echo "## Recent changes"
            git log --pretty=format:'- %s' -n 5
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload binaries
        uses: svenstaro/upload-release-action@v2
        with:
          tag: nightly
          overwrite: true
          file_glob: true
          file: ps2manager-*
          body: |
            ${{ steps.release_body.outputs.RELEASE_BODY }}
